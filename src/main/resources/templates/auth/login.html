<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body class="bg-light pagina-login">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow-sm w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 class="h4 mb-1" th:text="${nombreGimnasio}">Oficina del Cuerpo</h1>
                <p class="text-muted mb-0">Acceso al sistema de gestión</p>
            </div>

            <!-- Mensajes devueltos por Spring Security. -->
            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                Usuario o contraseña incorrectos.
            </div>
            <div class="alert alert-success" role="alert" th:if="${param.logout}">
                Sesión cerrada correctamente.
            </div>
            <div class="alert alert-warning" role="alert" th:if="${param.expired}">
                La sesión expiró por inactividad. Volvé a iniciar sesión.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-control" id="usuario" name="username" type="text"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="contrasena">Contraseña</label>
                    <input class="form-control" id="contrasena" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
