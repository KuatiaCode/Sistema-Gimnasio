<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <!-- Listado de clientes con acceso a edición y eliminación. -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}">1</td>
                    <td th:text="${cliente.nombre + ' ' + cliente.apellido}">Nombre</td>
                    <td th:text="${cliente.documento}">Documento</td>
                    <td th:text="${cliente.telefono}">Teléfono</td>
                    <td th:text="${cliente.correo}">Correo</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar este cliente?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(clientes)}">No hay clientes registrados.</p>
</main>
</body>
</html>
