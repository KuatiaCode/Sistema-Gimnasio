<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Fichas de Entrenamiento')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <!-- Fichas de entrenamiento asignadas a clientes y entrenadores. -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Fichas de entrenamiento</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/reportes/entrenamientos}">Reporte</a>
            <a class="btn btn-primary" th:href="@{/fichas-entrenamiento/nuevo}">Nueva ficha</a>
        </div>
    </div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Membresía</th>
                    <th>Planes</th>
                    <th>Entrenadores</th>
                    <th>Días</th>
                    <th>Fecha y hora</th>
                    <th>Objetivo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ficha : ${fichas}">
                    <td th:text="${ficha.id}">1</td>
                    <td th:text="${ficha.cliente != null ? ficha.cliente.nombre + ' ' + ficha.cliente.apellido : ''}">Cliente</td>
                    <td th:text="${ficha.membresia != null ? 'Membresía #' + ficha.membresia.id : ''}">Membresía</td>
                    <td>
                        <span class="badge text-bg-light border me-1"
                              th:if="${ficha.membresia != null}"
                              th:each="plan : ${ficha.membresia.planes}" th:text="${plan.nombre}">Plan</span>
                    </td>
                    <td>
                        <span class="badge text-bg-secondary me-1"
                              th:each="entrenador : ${ficha.entrenadores}" th:text="${entrenador.usuario}">Entrenador</span>
                    </td>
                    <td th:text="${ficha.diasSemanaTexto}">Días</td>
                    <td th:text="${#temporals.format(ficha.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td th:text="${ficha.objetivo}">Objetivo</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/fichas-entrenamiento/{id}/pdf(id=${ficha.id})}">PDF</a>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/fichas-entrenamiento/{id}/editar(id=${ficha.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/fichas-entrenamiento/{id}/eliminar(id=${ficha.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar esta ficha?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(fichas)}">No hay fichas de entrenamiento registradas.</p>
</main>
</body>
</html>
