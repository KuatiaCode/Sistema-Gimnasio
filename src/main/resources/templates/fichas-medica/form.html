<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Ficha Médica')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${ficha.id == null ? 'Nueva ficha médica' : 'Editar ficha médica'}">Ficha médica</h1>
    <form class="row g-3" th:object="${ficha}" th:action="@{/fichas-medica}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-4">
            <label class="form-label" for="clienteId">Cliente</label>
            <select class="form-select" id="clienteId" name="clienteId" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido}"
                        th:selected="${ficha.cliente != null and ficha.cliente.id == cliente.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="entrenadorId">Entrenador</label>
            <select class="form-select" id="entrenadorId" name="entrenadorId" required>
                <option th:each="entrenador : ${entrenadores}" th:value="${entrenador.id}"
                        th:text="${entrenador.usuario}"
                        th:selected="${ficha.entrenador != null and ficha.entrenador.id == entrenador.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-control" id="fecha" type="date" th:field="*{fecha}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="peso">Peso</label>
            <input class="form-control" id="peso" type="number" step="0.01" min="0" th:field="*{peso}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="altura">Altura</label>
            <input class="form-control" id="altura" type="number" step="0.01" min="0" th:field="*{altura}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="imc">IMC</label>
            <input class="form-control" id="imc" type="number" step="0.01" min="0" th:field="*{imc}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="porcentajeGrasa">% grasa</label>
            <input class="form-control" id="porcentajeGrasa" type="number" step="0.01" min="0"
                   th:field="*{porcentajeGrasa}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="masaCorporal">Masa corporal</label>
            <input class="form-control" id="masaCorporal" type="number" step="0.01" min="0"
                   th:field="*{masaCorporal}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="presionArterial">Presión arterial</label>
            <input class="form-control" id="presionArterial" type="number" step="0.01" min="0"
                   th:field="*{presionArterial}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="frecuenciaCardiaca">Frecuencia cardíaca</label>
            <input class="form-control" id="frecuenciaCardiaca" type="number" min="0"
                   th:field="*{frecuenciaCardiaca}" required>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" id="aptoEntrenar" type="checkbox" th:field="*{aptoEntrenar}">
                <label class="form-check-label" for="aptoEntrenar">Apto para entrenar</label>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="enfermedades">Enfermedades</label>
            <textarea class="form-control" id="enfermedades" rows="2" th:field="*{enfermedades}" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="alergias">Alergias</label>
            <textarea class="form-control" id="alergias" rows="2" th:field="*{alergias}" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="medicamentos">Medicamentos</label>
            <textarea class="form-control" id="medicamentos" rows="2" th:field="*{medicamentos}" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="cirugiasPrevias">Cirugías previas</label>
            <textarea class="form-control" id="cirugiasPrevias" rows="2" th:field="*{cirugiasPrevias}" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="lesiones">Lesiones</label>
            <textarea class="form-control" id="lesiones" rows="2" th:field="*{lesiones}" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="observacion">Observación</label>
            <textarea class="form-control" id="observacion" rows="2" th:field="*{observacion}"></textarea>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/fichas-medica}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
