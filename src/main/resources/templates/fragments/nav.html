<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Menú lateral compartido por todas las vistas. -->
<div th:fragment="nav" class="contenedor-navegacion">
    <!-- El checkbox permite abrir y cerrar el menú sin JavaScript. -->
    <input class="alternador-barra-lateral" id="alternador-menu-lateral" type="checkbox" aria-label="Abrir menú">
    <label class="boton-alternador-barra-lateral" for="alternador-menu-lateral" aria-label="Abrir menú">Menú</label>
    <label class="fondo-barra-lateral" for="alternador-menu-lateral" aria-label="Cerrar menú"></label>
    <aside class="barra-lateral">
        <a class="marca-gimnasio" th:href="@{/dashboard}">
            <span class="iniciales-gimnasio" th:text="${inicialesGimnasio}">OC</span>
            <span th:text="${nombreGimnasio}">Oficina del Cuerpo</span>
        </a>
        <p class="etiqueta-barra-lateral">Navegación</p>
        <ul class="navegacion-lateral">
            <li><a class="enlace-navegacion" th:href="@{/dashboard}">Dashboard</a></li>
            <li><a class="enlace-navegacion" th:href="@{/reportes}">Reportes</a></li>
            <li><a class="enlace-navegacion" th:href="@{/clientes}">Clientes</a></li>
            <li th:if="${puedeGestionarOperaciones}">
                <a class="enlace-navegacion" th:href="@{/membresias}">Membresías</a>
            </li>
            <li th:if="${puedeGestionarOperaciones}">
                <a class="enlace-navegacion" th:href="@{/planes}">Planes</a>
            </li>
            <li th:if="${puedeGestionarOperaciones}">
                <a class="enlace-navegacion" th:href="@{/pagos}">Pagos</a>
            </li>
            <li th:if="${puedeGestionarFichas}">
                <a class="enlace-navegacion" th:href="@{/fichas-entrenamiento}">Fichas de Entrenamiento</a>
            </li>
            <li th:if="${puedeGestionarFichas}">
                <a class="enlace-navegacion" th:href="@{/fichas-medica}">Fichas Médicas</a>
            </li>
            <li><a class="enlace-navegacion" th:href="@{/fallas}">Fallas</a></li>
            <li th:if="${esAdmin}">
                <a class="enlace-navegacion" th:href="@{/configuracion}">Configuración</a>
            </li>
        </ul>
        <div class="mt-auto pt-3 border-top border-secondary" th:if="${usuarioActual != null}">
            <p class="small mb-1" th:text="${usuarioActual}">Usuario</p>
            <p class="small text-white-50 mb-2" th:text="${rolActual}">Rol</p>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm w-100" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>
</div>
</body>
</html>
