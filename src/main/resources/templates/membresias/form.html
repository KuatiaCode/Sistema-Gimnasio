<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Membresía')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${membresia.id == null ? 'Nueva membresía' : 'Editar membresía'}">Membresía</h1>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-warning" role="alert" th:if="${membresia.estado == 3}">
        <span th:text="${'Membresía congelada del ' + membresia.fechaCongelacionInicio + ' al ' + membresia.fechaCongelacionFin + '.'}"></span>
        <span th:if="${membresia.motivoCongelacion != null}" th:text="${' Motivo: ' + membresia.motivoCongelacion}"></span>
    </div>
    <div class="alert alert-secondary" role="alert" th:if="${membresia.estado == 4}">
        <span th:text="${'Membresía inactiva desde ' + membresia.fechaCancelacion + '.'}"></span>
        <span th:if="${membresia.motivoCancelacion != null}" th:text="${' Motivo: ' + membresia.motivoCancelacion}"></span>
    </div>
    <!-- Los catálogos se envían como ids; el controlador resuelve las entidades. -->
    <form class="row g-3" th:object="${membresia}" th:action="@{/membresias}" method="post"
          th:attr="data-nueva=${membresia.id == null}">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="id-cliente">Cliente</label>
            <select class="form-select" id="id-cliente" name="clienteId" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido}"
                        th:selected="${membresia.cliente != null and membresia.cliente.id == cliente.id}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="fechaInicio">Fecha de inicio</label>
            <input class="form-control" id="fechaInicio" type="date" th:field="*{fechaInicio}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="fechaVencimiento">Fecha de vencimiento</label>
            <input class="form-control" id="fechaVencimiento" type="date" th:field="*{fechaVencimiento}" required>
        </div>

        <div class="col-12">
            <label class="form-label">Planes de la membresía</label>
            <div class="row g-2">
                <div class="col-md-6" th:each="plan : ${planes}">
                    <div class="form-check border rounded p-3 h-100">
                        <input class="form-check-input plan-membresia" type="checkbox" name="planIds"
                               th:id="'plan-' + ${plan.id}" th:value="${plan.id}"
                               th:checked="${membresia.planes != null and membresia.planes.contains(plan)}"
                               th:attr="data-precio=${plan.precio}">
                        <label class="form-check-label w-100" th:for="'plan-' + ${plan.id}">
                            <span class="fw-semibold" th:text="${plan.nombre}">Plan</span>
                            <span class="badge text-bg-secondary ms-1" th:text="${'Gs. ' + plan.precio}">Gs. 0</span>
                            <span class="d-block text-muted small descripcion-actividades"
                                  th:text="${#strings.abbreviate(plan.descripcion, 120)}">Actividades</span>
                        </label>
                    </div>
                </div>
            </div>
            <p class="text-muted mt-2 mb-0" th:if="${#lists.isEmpty(planes)}">
                No hay planes activos. Registrá un plan antes de crear una membresía.
            </p>
        </div>

        <div class="col-md-3">
            <label class="form-label" for="precioAPagar">Precio a pagar</label>
            <input class="form-control" id="precioAPagar" type="number" step="1" min="0"
                   th:field="*{precioAPagar}" readonly>
            <div class="form-text">Se calcula automáticamente con los planes seleccionados.</div>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-select" id="estado" th:field="*{estado}" required>
                <option value="1">Activa</option>
                <option value="2">Vencida</option>
                <option value="3">Congelada</option>
                <option value="4" th:if="${membresia.estado == 4}">Inactiva</option>
            </select>
            <div class="form-text" th:if="${membresia.id != null}">
                Para renovar, cancelar o congelar usá el historial de la membresía.
            </div>
        </div>
        <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" id="renovacionAutomatica" type="checkbox"
                       th:field="*{renovacionAutomatica}">
                <label class="form-check-label" for="renovacionAutomatica">Renovación automática (mensual)</label>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label" for="observaciones">Observaciones</label>
            <textarea class="form-control" id="observaciones" rows="3" th:field="*{observaciones}"></textarea>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/membresias}">Cancelar</a>
            <a class="btn btn-outline-secondary" th:if="${membresia.id != null}"
               th:href="@{/membresias/{id}/historial(id=${membresia.id})}">Historial</a>
        </div>
    </form>
</main>
<script th:src="@{/js/membresia-form.js(v=2)}"></script>
</body>
</html>
