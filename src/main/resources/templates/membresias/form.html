<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Membresía')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${membresia.id == null ? 'Nueva membresía' : 'Editar membresía'}">Membresía</h1>
    <form class="row g-3" th:object="${membresia}" th:action="@{/membresias}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="clienteId">Cliente</label>
            <select class="form-select" id="clienteId" name="clienteId" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido}"
                        th:selected="${membresia.cliente != null and membresia.cliente.id == cliente.id}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="planId">Plan</label>
            <select class="form-select" id="planId" name="planId" required>
                <option th:each="plan : ${planes}" th:value="${plan.id}" th:text="${plan.nombre}"
                        th:selected="${membresia.planesMembresia != null and membresia.planesMembresia.id == plan.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="fechaInicio">Fecha de inicio</label>
            <input class="form-control" id="fechaInicio" type="date" th:field="*{fechaInicio}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="fechaVencimiento">Fecha de vencimiento</label>
            <input class="form-control" id="fechaVencimiento" type="date" th:field="*{fechaVencimiento}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-select" id="estado" th:field="*{estado}" required>
                <option value="1">Activa</option>
                <option value="2">Vencida</option>
                <option value="3">Congelada</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="precioPagado">Precio pagado</label>
            <input class="form-control" id="precioPagado" type="number" step="0.01" min="0"
                   th:field="*{precioPagado}">
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" id="renovacionAutomatica" type="checkbox"
                       th:field="*{renovacionAutomatica}">
                <label class="form-check-label" for="renovacionAutomatica">Renovación automática</label>
            </div>
        </div>
        <div class="col-12">
            <label class="form-label" for="observaciones">Observaciones</label>
            <textarea class="form-control" id="observaciones" rows="3" th:field="*{observaciones}"></textarea>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/membresias}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
