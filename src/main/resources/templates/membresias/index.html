<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Membresías')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <!-- Membresías contratadas, con cliente, planes y vigencia. -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Membresías</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/reportes/membresias}">Reporte</a>
            <a class="btn btn-primary" th:href="@{/membresias/nuevo}">Nueva membresía</a>
        </div>
    </div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Planes</th>
                    <th>Inicio</th>
                    <th>Vencimiento</th>
                    <th>Precio a pagar</th>
                    <th>Estado</th>
                    <th>Renovación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="membresia : ${membresias}">
                    <td th:text="${membresia.id}">1</td>
                    <td th:text="${membresia.cliente != null ? membresia.cliente.nombre + ' ' + membresia.cliente.apellido : ''}">Cliente</td>
                    <td>
                        <span class="badge text-bg-light border me-1"
                              th:each="plan : ${membresia.planes}" th:text="${plan.nombre}">Plan</span>
                    </td>
                    <td th:text="${membresia.fechaInicio}">Inicio</td>
                    <td th:text="${membresia.fechaVencimiento}">Vencimiento</td>
                    <td th:text="${'Gs. ' + membresia.precioAPagar}">0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${membresia.estado == 1 ? 'text-bg-success' : (membresia.estado == 2 ? 'text-bg-danger' : (membresia.estado == 3 ? 'text-bg-warning' : 'text-bg-secondary'))}"
                              th:text="${membresia.estadoTexto}">Activa</span>
                    </td>
                    <td th:text="${membresia.renovacionAutomatica} ? 'Mensual' : 'No'">No</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/membresias/{id}/historial(id=${membresia.id})}">Historial</a>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/membresias/{id}/editar(id=${membresia.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/membresias/{id}/eliminar(id=${membresia.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar esta membresía?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(membresias)}">No hay membresías registradas.</p>
</main>
</body>
</html>
