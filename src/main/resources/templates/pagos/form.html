<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Pago')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${pago.id == null ? 'Nuevo pago' : 'Editar pago'}">Pago</h1>
    <form class="row g-3" th:object="${pago}" th:action="@{/pagos}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="clienteId">Cliente</label>
            <select class="form-select" id="clienteId" name="clienteId" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido}"
                        th:selected="${pago.cliente != null and pago.cliente.id == cliente.id}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="membresiaId">Membresía (opcional)</label>
            <select class="form-select" id="membresiaId" name="membresiaId">
                <option value="">Sin membresía</option>
                <option th:each="membresia : ${membresias}" th:value="${membresia.id}"
                        th:text="${'Membresía #' + membresia.id}"
                        th:selected="${pago.membresia != null and pago.membresia.id == membresia.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="montoTotal">Monto total</label>
            <input class="form-control" id="montoTotal" type="number" step="0.01" min="0"
                   th:field="*{montoTotal}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="descuentoAplicado">Descuento aplicado</label>
            <input class="form-control" id="descuentoAplicado" type="number" step="0.01" min="0"
                   th:field="*{descuentoAplicado}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="metodoPago">Método de pago</label>
            <select class="form-select" id="metodoPago" th:field="*{metodoPago}" required>
                <option value="1">Efectivo</option>
                <option value="2">Tarjeta</option>
                <option value="3">Transferencia</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="fechaPago">Fecha de pago</label>
            <input class="form-control" id="fechaPago" type="datetime-local" th:field="*{fechaPago}" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/pagos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
