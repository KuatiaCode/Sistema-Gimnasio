<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Pagos')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <!-- Listado de pagos con su membresía asociada. -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Pagos</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/reportes/ingresos}">Reporte</a>
            <a class="btn btn-primary" th:href="@{/pagos/nuevo}">Nuevo pago</a>
        </div>
    </div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Membresía</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Método</th>
                    <th>Fecha</th>
                    <th>Descuento</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pago : ${pagos}">
                    <td th:text="${pago.id}">1</td>
                    <td th:text="${pago.cliente != null ? pago.cliente.nombre + ' ' + pago.cliente.apellido : ''}">Cliente</td>
                    <td th:text="${pago.membresia != null ? pago.membresia.id : ''}">Membresía</td>
                    <td th:text="${'Gs. ' + pago.montoTotal}">0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${pago.estadoPago == 1 ? 'text-bg-warning' : (pago.estadoPago == 2 ? 'text-bg-success' : 'text-bg-secondary')}"
                              th:text="${pago.estadoPago == 1 ? 'Pendiente' : (pago.estadoPago == 2 ? 'Pagado' : 'Anulado')}">Pendiente</span>
                    </td>
                    <td th:text="${pago.metodoPago == null ? 'Sin definir' : (pago.metodoPago == 1 ? 'Efectivo' : (pago.metodoPago == 2 ? 'Tarjeta' : 'Transferencia'))}">Sin definir</td>
                    <td th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm') : ''}">Fecha</td>
                    <td th:text="${'Gs. ' + pago.descuentoAplicado}">0</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/pagos/{id}/editar(id=${pago.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/pagos/{id}/eliminar(id=${pago.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar este pago?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(pagos)}">No hay pagos registrados.</p>
</main>
</body>
</html>
