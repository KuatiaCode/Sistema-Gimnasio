<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Plan')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${plan.id == null ? 'Nuevo plan' : 'Editar plan'}">Plan</h1>
    <!-- Formulario reutilizado para crear y editar planes. -->
    <form class="row g-3" th:object="${plan}" th:action="@{/planes}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="duracionDias">Duración (días)</label>
            <input class="form-control" id="duracionDias" type="number" min="1" th:field="*{duracionDias}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="precio">Precio</label>
            <input class="form-control" id="precio" type="number" step="0.01" min="0" th:field="*{precio}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-select" id="estado" th:field="*{estado}" required>
                <option value="1">Activo</option>
                <option value="0">Inactivo</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" id="accesoVip" type="checkbox" th:field="*{accesoVip}">
                <label class="form-check-label" for="accesoVip">Acceso VIP</label>
            </div>
        </div>
        <div class="col-12">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}"></textarea>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/planes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
