<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Reporte')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <a class="small text-decoration-none" th:href="@{/reportes}">Volver a reportes</a>
            <h1 class="h3 mb-1" th:text="${tipo.titulo}">Reporte</h1>
            <p class="text-muted mb-0" th:text="${reporte.subtitulo}">Filtros</p>
        </div>
        <div class="btn-group" role="group" aria-label="Exportar reporte">
            <a class="btn btn-outline-secondary"
               th:href="@{/reportes/{slug}/exportar(slug=${tipo.slug}, formato='csv', fechaDesde=${filtro.fechaDesde}, fechaHasta=${filtro.fechaHasta}, estado=${filtro.estado}, clienteId=${filtro.clienteId}, metodoPago=${filtro.metodoPago}, prioridad=${filtro.prioridad}, responsableId=${filtro.responsableId}, texto=${filtro.texto})}">
                CSV
            </a>
            <a class="btn btn-outline-success"
               th:href="@{/reportes/{slug}/exportar(slug=${tipo.slug}, formato='xlsx', fechaDesde=${filtro.fechaDesde}, fechaHasta=${filtro.fechaHasta}, estado=${filtro.estado}, clienteId=${filtro.clienteId}, metodoPago=${filtro.metodoPago}, prioridad=${filtro.prioridad}, responsableId=${filtro.responsableId}, texto=${filtro.texto})}">
                XLSX
            </a>
            <a class="btn btn-outline-danger" target="_blank"
               th:href="@{/reportes/{slug}/exportar(slug=${tipo.slug}, formato='pdf', inline=true, fechaDesde=${filtro.fechaDesde}, fechaHasta=${filtro.fechaHasta}, estado=${filtro.estado}, clienteId=${filtro.clienteId}, metodoPago=${filtro.metodoPago}, prioridad=${filtro.prioridad}, responsableId=${filtro.responsableId}, texto=${filtro.texto})}">
                Vista previa PDF
            </a>
            <a class="btn btn-outline-danger"
               th:href="@{/reportes/{slug}/exportar(slug=${tipo.slug}, formato='pdf', fechaDesde=${filtro.fechaDesde}, fechaHasta=${filtro.fechaHasta}, estado=${filtro.estado}, clienteId=${filtro.clienteId}, metodoPago=${filtro.metodoPago}, prioridad=${filtro.prioridad}, responsableId=${filtro.responsableId}, texto=${filtro.texto})}">
                PDF
            </a>
        </div>
    </div>

    <form class="card card-body shadow-sm mb-3" method="get"
          th:action="@{/reportes/{slug}(slug=${tipo.slug})}" th:object="${filtro}">
        <div th:replace="~{reportes/filtros :: filtros(${filtro}, ${clientes}, ${responsables}, ${tipo.name()})}"></div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Aplicar filtros</button>
            <a class="btn btn-outline-secondary" th:href="@{/reportes/{slug}(slug=${tipo.slug})}">Limpiar</a>
        </div>
    </form>

    <div class="mb-3">
        <span class="badge text-bg-light border me-1" th:each="linea : ${reporte.resumen}"
              th:text="${linea}">Resumen</span>
    </div>

    <div th:replace="~{reportes/tabla :: tabla(${reporte})}"></div>
    <p class="small text-muted mt-2"
       th:text="${'Generado: ' + #temporals.format(reporte.generadoEn, 'dd/MM/yyyy HH:mm')}">Generado</p>
</main>
</body>
</html>
