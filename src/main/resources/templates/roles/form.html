<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Rol')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <div th:replace="~{configuracion/tabs :: tabs('roles')}"></div>
    <h1 class="h3 mb-3" th:text="${rol.id == null ? 'Nuevo rol' : 'Editar rol'}">Rol</h1>
    <form class="row g-3" th:object="${rol}" th:action="@{/configuracion/roles}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required>
        </div>
        <div class="col-12">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}" required></textarea>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/configuracion/roles}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
