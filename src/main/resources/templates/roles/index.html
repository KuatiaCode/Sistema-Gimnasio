<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Roles')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Roles</h1>
        <a class="btn btn-primary" th:href="@{/roles/nuevo}">Nuevo rol</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rol : ${roles}">
                    <td th:text="${rol.id}">1</td>
                    <td th:text="${rol.nombre}">Nombre</td>
                    <td th:text="${rol.descripcion}">Descripción</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/roles/{id}/editar(id=${rol.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/roles/{id}/eliminar(id=${rol.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar este rol?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(roles)}">No hay roles registrados.</p>
</main>
</body>
</html>
