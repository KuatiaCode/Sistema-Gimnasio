<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <div th:replace="~{configuracion/tabs :: tabs('usuarios')}"></div>
    <h1 class="h3 mb-3" th:text="${usuarioForm.id == null ? 'Nuevo usuario' : 'Editar usuario'}">Usuario</h1>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <!-- Se usa usuarioForm para no colisionar con el campo usuario de la entidad. -->
    <form class="row g-3" th:object="${usuarioForm}" th:action="@{/configuracion/usuarios}" method="post"
          autocomplete="off">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label" for="usuario">Usuario</label>
            <input class="form-control" id="usuario" type="text" th:field="*{usuario}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" id="correo" type="email" th:field="*{correo}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="contrasena">Contraseña</label>
            <input class="form-control" id="contrasena" name="password" type="password"
                   autocomplete="new-password" th:required="${usuarioForm.id == null}">
            <div class="form-text" th:if="${usuarioForm.id != null}">
                Dejá el campo vacío para conservar la contraseña actual.
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="id-rol">Rol</label>
            <select class="form-select" id="id-rol" name="rolesId" required>
                <option th:each="rol : ${roles}" th:value="${rol.id}"
                        th:text="|${rol.nombre} (${rol.codigo})|"
                        th:selected="${usuarioForm.roles != null and usuarioForm.roles.id == rol.id}"></option>
            </select>
        </div>
        <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
                <input class="form-check-input" id="dosPasosActivo" type="checkbox" th:field="*{dosPasosActivo}">
                <label class="form-check-label" for="dosPasosActivo">Dos pasos activo</label>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/configuracion/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
