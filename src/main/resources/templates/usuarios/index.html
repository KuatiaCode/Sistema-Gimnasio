<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Dos pasos</th>
                    <th>Intentos fallidos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td th:text="${usuario.usuario}">Usuario</td>
                    <td th:text="${usuario.correo}">Correo</td>
                    <td th:text="${usuario.roles != null ? usuario.roles.nombre : ''}">Rol</td>
                    <td th:text="${usuario.dosPasosActivo} ? 'Sí' : 'No'">No</td>
                    <td th:text="${usuario.intentosFallidos}">0</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}"
                              method="post" onsubmit="return confirm('¿Eliminar este usuario?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(usuarios)}">No hay usuarios registrados.</p>
</main>
</body>
</html>
